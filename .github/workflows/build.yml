name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: swift build
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Assemble .app bundle
        run: ./Scripts/build_app.sh

      - name: Verify bundle launches without crashing
        run: |
          ./build/Idle.app/Contents/MacOS/Idle &
          sleep 4
          if ! pgrep -f "Idle.app/Contents/MacOS/Idle" > /dev/null; then
            echo "Bundle exited within 4 seconds — likely a crash on launch."
            exit 1
          fi
          pkill -f "Idle.app/Contents/MacOS/Idle" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Idle.app
          path: build/Idle.app
          retention-days: 14
